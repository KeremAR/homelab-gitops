apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/KeremAR/homelab-gitops.git
    targetRevision: main
    path: argocd-helm/environments/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
